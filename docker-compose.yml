version: "3.8"

services:

  api:
    image: infralightio/test-integration-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "echo 'health check' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 10s

  tests:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      - BASE_URL=http://api:8080/api/v1
      - USER1_USERNAME=test1
      - USER1_PASSWORD=test123
      - USER2_USERNAME=test2
      - USER2_PASSWORD=test456
    volumes:
      - ./reports:/app/reports
    command: >
      pytest --tb=short -q
      -m "not load"
      --html=reports/report.html
      --self-contained-html